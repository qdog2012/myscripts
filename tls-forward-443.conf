# Public HTTPS passthrough listener.
# Put this file under:
# /serverdata/1panel/www/stream.d/tls-forward-443.conf
#
# The Debian setup script mounts this directory into OpenResty and includes it
# from a stream {} block. Do not wrap this file in another stream {} block.

resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

map $ssl_preread_server_name $tls_18443_upstream {
    chatgpt.com      chatgpt.com:443;
    www.chatgpt.com  www.chatgpt.com:443;
    ab.chatgpt.com  ab.chatgpt.com:443;
    #auth-cdn.oaistatic.com  auth-cdn.oaistatic.com:443;
    openai.com      openai.com:443;
    www.openai.com  www.openai.com:443;
    auth.openai.com  auth.openai.com:443;
    help.openai.com  help.openai.com:443;
    sentinel.openai.com  sentinel.openai.com:443;

    # Send unmatched SNI names to the website HTTPS listener.
    default            127.0.0.1:18443;
}

server {
    # Accept TLS connections on every IPv4 interface.
    listen 0.0.0.0:443;

    proxy_connect_timeout 5s;
    proxy_timeout 10m;
    proxy_pass $tls_18443_upstream;

    ssl_preread on;
}
